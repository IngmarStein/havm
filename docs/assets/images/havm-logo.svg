<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="havm">
  <title>havm</title>
  <!--
    The Dock tile, drawn from the same geometry as scripts/make-app-icon.swift:
    a cyan house holding a white isometric box, on the near-white tile the
    system composes the real icon over. Keep the two in step — the house is a
    500×500 rect at (262,262) with a 176 apex and 46 corner radius, and the box
    is centred at (512,546) with a 152×76 top face and a 108-tall body.
  -->
  <defs>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3dc7fa"/>
      <stop offset="1" stop-color="#12a3ed"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="#f5faff"/>

  <!-- House: rounded at every vertex, 46 at the square corners and a little
       tighter where the roof meets the walls and at the apex, as the
       generator's tangent arcs do. -->
  <path fill="url(#house)" d="
      M 308 762
      Q 262 762 262 716
      L 262 462
      Q 262 438 281 424
      L 486 281
      Q 512 262 538 281
      L 743 424
      Q 762 438 762 462
      L 762 716
      Q 762 762 716 762
      Z"/>

  <!-- Box: white top, then the two sides, lighter on the right. -->
  <g>
    <polygon points="512,470 664,546 512,622 360,546" fill="#fff"/>
    <polygon points="360,546 512,622 512,730 360,654" fill="#fff" fill-opacity="0.70"/>
    <polygon points="512,622 664,546 664,654 512,730" fill="#fff" fill-opacity="0.86"/>
  </g>
</svg>
